[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobra-ai"
version = "0.1.0"
description = "Cobra: a voice assistant for the Cobra Queen Hyprland setup"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
cobrad = "cobrad.main:run"
cobractl = "cobrad.ctl:main"

[tool.setuptools.packages.find]
include = ["cobrad*"]

[tool.setuptools.package-data]
cobrad = ["defaults/*"]
