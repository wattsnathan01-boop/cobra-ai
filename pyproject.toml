[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobra-ai"
version = "0.1.0"
description = "Cobra: a voice assistant for the Cobra Queen Hyprland setup"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
]

[project.optional-dependencies]
# CUDA 12 libraries for Whisper on the GPU (Arch's system CUDA is 13; CTranslate2 needs 12)
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
cobrad = "cobrad.main:run"
cobractl = "cobrad.ctl:main"

[tool.setuptools.packages.find]
include = ["cobrad*"]

[tool.setuptools.package-data]
cobrad = ["defaults/*"]
