# Cobra config. Copy to ~/.config/cobra/config.toml to override.

[brain]
# local only for now; "claude" and "auto" arrive with the Claude brain
mode = "local"

[local]
host = "http://localhost:11434"
model = "qwen3:8b"
vision_model = "gemma3:4b"
# qwen3 can reason before answering; off keeps spoken replies fast
think = false
keep_alive = "10m"

[claude]
model = "claude-opus-5-5"
fast_model = "claude-haiku-5-5"

[voice]
# Piper voice, female, British for now (no Australian Piper voice exists yet).
# Others to try: en_GB-jenny_dioco-medium, en_GB-southern_english_female-low
# Change it, then: systemctl --user restart cobra  (new voices download on first start)
piper_voice = "en_GB-cori-high"

[ears]
# faster-whisper model; "small.en" is lighter if VRAM gets tight
whisper_model = "large-v3-turbo"
# "auto" uses the GPU when it works, otherwise the CPU (slower)
device = "auto"
# longest single push-to-talk recording
max_seconds = 30

[wake]
# say "Cobra, …" instead of holding SUPER+C. The mic stays open; phrases that don't start
# with "Cobra" are dropped without being kept or logged. Toggle: cobractl wake on|off
enabled = true
# Silero voice-detector confidence needed to start a phrase (raise if noise sets it off)
threshold = 0.6
# after just "Cobra", how long she waits for the question
follow_up_seconds = 8

[agent]
max_steps = 8
history_turns = 12
confirm_timeout = 20
